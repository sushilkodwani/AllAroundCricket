<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B1C1F"/>
      <stop offset="1" stop-color="#7A1518"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="113" fill="url(#bg)"/>
  <g id="art">
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <!-- bat: swung high over the shoulder in a strong diagonal -->
      <path d="M286 172 L246 132" stroke-width="13"/>
      <path d="M240 126 L158 66" stroke-width="30"/>
      <!-- arms up to the handle -->
      <path d="M232 214 L270 170 L290 176" stroke-width="24"/>
      <path d="M262 222 L292 180" stroke-width="22"/>
      <!-- torso, leaning into the shot -->
      <path d="M240 216 L268 306" stroke-width="52"/>
      <!-- front leg planted -->
      <path d="M262 312 L206 362 L184 432" stroke-width="34"/>
      <path d="M184 436 L150 438" stroke-width="22"/>
      <!-- back leg bent -->
      <path d="M276 312 L330 352 L318 424" stroke-width="34"/>
      <path d="M318 430 L352 436" stroke-width="22"/>
      <!-- ball flight -->
      <path d="M312 150 Q352 112 388 104" stroke-width="7" stroke-dasharray="2 16"/>
    </g>
    <!-- helmeted head -->
    <circle cx="222" cy="166" r="33" fill="#FFFFFF"/>
    <path d="M190 160 Q222 108 258 152 L266 166 L190 166 Z" fill="#FFFFFF"/>
    <!-- ball with one seam -->
    <circle cx="414" cy="98" r="22" fill="#FFFFFF"/>
    <path d="M400 84 Q416 98 404 116" fill="none" stroke="#9B1C1F" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
