# Copy this file into the PRIVATE DATA repo as .github/workflows/notify.yml
# (not into the app repo). See notifier/README.md.
name: Notify on match expenses

on:
  push:
    # Match saves (expenses) and payment reminders the admin asks for in the app.
    # The notifier's own commits touch push/state.json and are skipped.
    paths:
      - 'teams/*/matches.json'
      - 'push/outbox.json'
  schedule:
    # Every day at 18:00 India time (12:30 UTC): remind the squad of tomorrow's match.
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      message:
        description: 'Send this test message to every subscribed device'
        default: 'Test notification from All Around Cricket 🏏'

permissions:
  contents: write

# Batching: each save is a commit. A newer push cancels a run that is still
# waiting, so "submit, then fix and re-submit" ends in ONE notification.
concurrency:
  group: notify
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for edits to settle
        if: github.event_name == 'push'
        run: sleep 30

      - uses: actions/checkout@v4
        with:
          # Latest tip of the branch, not the commit that triggered this run.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web-push
        working-directory: notify
        run: npm install --no-audit --no-fund

      - name: Send notifications
        run: node notify/notify.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          BEFORE_SHA: ${{ github.event.before }}
          TEST_MESSAGE: ${{ github.event.inputs.message }}
          MODE: ${{ github.event_name == 'schedule' && 'reminders' || '' }}
